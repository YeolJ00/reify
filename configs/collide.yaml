# M7: COLLISION-DOMINATED scene to break the density gauge. A heavy striker
# (teapot) hits a light target (triceratops) at rest on a low-friction tabletop,
# near-elastically. Post-collision velocities depend on the MASS RATIO -> relative
# density should become strongly observable while the overall mass scale stays a
# gauge (elastic collisions are scale-invariant). Minimal drop + low friction so
# the collision, not free-flight/sliding, dominates the motion.
seed: 42
device: "cuda:0"

environment: table
table:
  name: wooden_table_02
  target_faces: 4000
  top_z: 0.706
  half_x: 0.55
  half_y: 0.38
  thickness: 0.04
  mu: 0.30                 # moderate friction: contains the objects, and post-collision
                          # stopping distance encodes each object's post-impact velocity

sim:
  fps: 60
  num_frames: 66            # 1.1 s (long enough to see post-collision divergence)
  substeps: 28
  xpbd_iterations: 18
sdf_resolution: 64

# Similar-volume objects (comparable base mass) so the collision splits momentum
# cleanly and stays on the table; density then sets the mass RATIO.
objects:
  - name: Weisshai_Great_White_Shark         # moving toward +x
    target_faces: 1200
    pos: [-0.15, 0.0, 0.744]
  - name: Great_Dinos_Triceratops_Toy        # moving toward -x (head-on)
    target_faces: 1200
    pos: [0.11, 0.0, 0.744]

# theta per object = [log_density, mu, restitution, v0x, v0y, v0z]
# HEAD-ON: both launched toward each other so they meet centrally regardless of
# exact geometry. Post-collision velocity split -> mass ratio -> relative density.
theta:
  true_values:
    - {density: 800.0, mu: 0.30, restitution: 0.7, v0: [1.6, 0.0, 0.0]}   # -> +x
    - {density: 400.0, mu: 0.30, restitution: 0.7, v0: [-1.3, 0.0, 0.0]}  # -> -x
  init_values:
    - {density: 1500.0, mu: 0.30, restitution: 0.4, v0: [1.0, 0.0, 0.0]}
    - {density: 1500.0, mu: 0.30, restitution: 0.4, v0: [-0.8, 0.0, 0.0]}
